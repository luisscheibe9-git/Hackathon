<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stillpoint Observatory</title>
<link rel="stylesheet" href="./observatory.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module" src="./observatory.js"></script>
</head>
<body>
<main>
  <header><div><h1>Stillpoint Observatory</h1><p>Live Wi-Fi sensing</p></div><output id="status" role="status">Connecting</output></header>
  <section id="replay" class="detection replay" aria-label="Replay controls" hidden>
    <div><h2 id="replay-verdict" aria-live="polite">Loading replay</h2><p id="replay-detail"></p></div>
    <div class="replay-controls">
      <button id="replay-toggle" type="button">Pause</button>
      <input id="replay-seek" type="range" min="0" max="1" step="0.25" value="0" aria-label="Replay position">
      <select id="replay-speed" aria-label="Replay speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>8</option></select>
    </div>
  </section>
  <section class="detection" aria-label="Motion detection">
    <div><h2 id="motion-status" aria-live="polite">Calibration needed</h2><p id="motion-detail">Clear the room before recording the quiet baseline.</p></div>
    <button id="calibrate" type="button" disabled>Calibrate empty room</button>
  </section>
  <div id="scene" aria-label="Schematic 3D floor showing activity along the Wi-Fi paths">
    <div id="transmitter" class="marker">Wi-Fi transmitter</div>
    <div id="markers"></div>
    <div class="layout">Schematic layout · brighter paths show more CSI change</div>
  </div>
  <section id="receivers" aria-label="Receiver telemetry"></section>
</main>
</body>
</html>
